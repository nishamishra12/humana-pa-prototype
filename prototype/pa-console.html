<title>Prior Auth Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F3F6F4;
  --surface:#FFFFFF;
  --surface-2:#EAF0ED;
  --ink:#16211E;
  --ink-2:#3C4A45;
  --muted:#66766F;
  --faint:#94A39C;
  --border:#DCE5DF;
  --brand:#2B5F6E;
  --brand-soft:#DEEAEC;
  --brand-ink:#FFFFFF;
  --good:#2F7A52;
  --good-soft:#E2F0E6;
  --warn:#A6690C;
  --warn-soft:#F6E9D5;
  --bad:#A63A2E;
  --bad-soft:#F6E1DD;
  --shadow:0 1px 2px rgba(22,33,30,.06), 0 8px 20px -10px rgba(22,33,30,.2);
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Consolas,monospace;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1413; --surface:#161F1D; --surface-2:#1C2624;
    --ink:#E7EEEB; --ink-2:#C3CFCA; --muted:#8FA098; --faint:#647169;
    --border:#28332F;
    --brand:#7FB8C9; --brand-soft:#1B3238; --brand-ink:#0E1413;
    --good:#5FBE8B; --good-soft:#173226;
    --warn:#E0A857; --warn-soft:#3A2A12;
    --bad:#E28A7C; --bad-soft:#3A211C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 20px -10px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1413; --surface:#161F1D; --surface-2:#1C2624;
  --ink:#E7EEEB; --ink-2:#C3CFCA; --muted:#8FA098; --faint:#647169;
  --border:#28332F;
  --brand:#7FB8C9; --brand-soft:#1B3238; --brand-ink:#0E1413;
  --good:#5FBE8B; --good-soft:#173226;
  --warn:#E0A857; --warn-soft:#3A2A12;
  --bad:#E28A7C; --bad-soft:#3A211C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 20px -10px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
html,body{height:100%}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono{font-family:var(--mono)}

.app{display:flex;min-height:100%}
.sidebar{width:300px;flex:0 0 300px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column}
.sidebar-head{padding:18px 18px 14px;border-bottom:1px solid var(--border)}
.brand-mark{font-weight:700;font-size:15px;letter-spacing:-0.01em}
.brand-sub{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:3px}

.role-toggle{display:flex;gap:2px;background:var(--surface-2);border-radius:8px;padding:2px;margin-top:14px}
.role-btn{flex:1;border:0;background:transparent;padding:7px 6px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted)}
.role-btn.active{background:var(--surface);color:var(--brand);box-shadow:var(--shadow)}

.queue-label{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:16px 18px 8px}
.queue-list{display:flex;flex-direction:column;gap:1px;overflow-y:auto;padding:0 8px 12px}
.queue-empty{margin:8px 10px;padding:18px 14px;background:var(--surface-2);border-radius:8px;font-size:12.5px;color:var(--muted)}

.qcard{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:8px;padding:11px 10px;margin-bottom:1px}
.qcard:hover{background:var(--surface-2)}
.qcard.active{background:var(--brand-soft);border-color:var(--brand)}
.qcard-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.qcard-name{font-weight:600;font-size:13.5px;color:var(--ink)}
.qcard-id{font-family:var(--mono);font-size:10px;color:var(--faint)}
.qcard-proc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
.qcard-chip{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:3px 7px;border-radius:5px}
.chip-pend{background:var(--warn-soft);color:var(--warn)}
.chip-ready{background:var(--brand-soft);color:var(--brand)}
.chip-escalated{background:var(--bad-soft);color:var(--bad)}
.chip-approved{background:var(--good-soft);color:var(--good)}
.chip-denied{background:var(--bad-soft);color:var(--bad)}

.sidebar-foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--border);font-size:11px;color:var(--faint);line-height:1.5}

.main{flex:1;min-width:0;overflow-y:auto}
.main-inner{max-width:820px;margin:0 auto;padding:28px 32px 60px}
.main-empty{display:flex;align-items:center;justify-content:center;height:70vh;color:var(--faint);font-size:14px}

.case-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--border);margin-bottom:26px}
.case-name{font-size:21px;font-weight:700;letter-spacing:-.01em}
.case-meta{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:5px}
.case-proc{font-size:13.5px;color:var(--ink-2);margin-top:9px;max-width:46ch}
.case-status{text-align:right;flex:0 0 auto}
.status-chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:5px 10px;border-radius:6px}
.status-dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.case-submitted{font-size:11px;color:var(--faint);margin-top:7px}

.step{margin-bottom:30px}
.step-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.step-num{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--surface-2);color:var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:600}
.step-num.done{background:var(--good-soft);color:var(--good)}
.step-title{font-size:14.5px;font-weight:700}
.step-body{margin-left:32px}

.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.doc{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:13px 14px;box-shadow:var(--shadow)}
.doc-name{font-weight:600;font-size:12.5px}
.doc-page{font-family:var(--mono);font-size:10px;color:var(--faint);margin-top:2px}
.doc-snippet{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.55}
.doc-snippet mark{background:var(--warn-soft);color:var(--ink);padding:0 2px;border-radius:2px;font-weight:600}

.fact-row{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.fact-row:last-child{border-bottom:0}
.fact-label{flex:0 0 190px;color:var(--muted)}
.fact-val{flex:1;font-weight:600}
.fact-val.uncertain{color:var(--warn)}

.crit{background:var(--surface);border:1px solid var(--border);border-radius:9px;overflow:hidden;box-shadow:var(--shadow)}
.crit-row{display:flex;gap:14px;align-items:flex-start;padding:13px 15px;border-bottom:1px solid var(--border)}
.crit-row:last-child{border-bottom:0}
.crit-status{flex:0 0 92px}
.crit-body{flex:1;min-width:0}
.crit-label{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.crit-source{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:5px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:600;letter-spacing:.03em;padding:4px 8px;border-radius:6px;white-space:nowrap}
.badge-met{background:var(--good-soft);color:var(--good)}
.badge-notmet{background:var(--bad-soft);color:var(--bad)}
.badge-uncertain{background:var(--warn-soft);color:var(--warn)}

.gate{background:var(--warn-soft);border:1px solid color-mix(in srgb, var(--warn) 40%, var(--border));border-radius:9px;padding:16px 17px}
.gate-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--warn);font-weight:700;margin-bottom:7px}
.gate-q{font-size:14px;font-weight:600;color:var(--ink)}
.gate-sub{font-size:12px;color:var(--muted);margin-top:5px}
.gate-actions{margin-top:13px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.gate-sent{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}

.rec{border-radius:9px;padding:17px 18px}
.rec.approve{background:var(--good-soft)}
.rec.escalate{background:var(--bad-soft)}
.rec-label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;margin-bottom:7px}
.rec.approve .rec-label{color:var(--good)}
.rec.escalate .rec-label{color:var(--bad)}
.rec-text{font-size:14px;font-weight:600;color:var(--ink)}
.rec-sub{font-size:12.5px;color:var(--ink-2);margin-top:7px;line-height:1.55}
.rec-actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}

.btn{border:0;border-radius:7px;padding:9px 15px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:7px}
.btn-primary{background:var(--brand);color:var(--brand-ink)}
.btn-good{background:var(--good);color:#fff}
.btn-bad{background:var(--bad);color:#fff}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--border)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.decided-note{font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:13px 15px;box-shadow:var(--shadow)}
.decided-note b{color:var(--ink)}
.director-lock{font-size:12px;color:var(--faint);margin-top:8px;font-style:italic}

.audit-toggle{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:11px 15px;display:flex;align-items:center;justify-content:space-between;width:100%;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.audit-log{margin-top:10px;background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:4px 15px}
.audit-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:12px}
.audit-item:last-child{border-bottom:0}
.audit-t{flex:0 0 122px;font-family:var(--mono);color:var(--faint);font-size:11px;padding-top:1px}
.audit-text{color:var(--ink-2);line-height:1.5}

@media (max-width:820px){
  .app{flex-direction:column}
  .sidebar{width:100%;flex:0 0 auto;border-right:0;border-bottom:1px solid var(--border);max-height:none}
  .queue-list{flex-direction:row;overflow-x:auto;padding:0 12px 14px}
  .qcard{flex:0 0 220px}
  .main-inner{padding:22px 18px 48px}
  .fact-label{flex:0 0 140px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app"></div>

<script>
(function(){

  var CRIT = {
    setting:  { label: "Planned procedure is appropriate for an inpatient setting and is not on the outpatient-only list.", source: "LCD L38795 — Inpatient-Only Procedures" },
    comorbid: { label: "Documented comorbidities raise peri-operative risk.", source: "MCG Inpatient & Surgical Care Guidelines" },
    los:      { label: "Expected length of stay crosses at least two midnights.", source: "CMS Two-Midnight Rule, 42 CFR 412.3" },
    monitor:  { label: "Post-operative monitoring needs cannot be met outpatient or under observation.", source: "Humana Internal Medical Policy IP-014" }
  };

  // What to actually ask the provider, per criterion — selected dynamically
  // by whichever criterion the extraction came back uncertain on, not fixed
  // to any one field.
  var GATE_Q = {
    setting: "Can you confirm the planned procedure and the intended admission setting?",
    comorbid: "Can you provide documentation of any comorbidities relevant to this admission?",
    los: "What is the expected length of stay for this admission?",
    monitor: "What post-operative monitoring is planned, and can it be provided outside an inpatient setting?"
  };

  // ---------------------------------------------------------------
  // The engine. Real pattern extraction over raw document text, run
  // fresh on every render. Nothing below is pre-computed per case —
  // facts, criteria status, and evidence text are all derived here.
  // ---------------------------------------------------------------
  var PAT = {
    heartFailure: /heart failure\s*\(ef\s*(\d+)\s*%\)/i,
    diabetes:     /type\s*2\s*diabetes/i,
    copdO2:       /copd[^.]{0,20}oxygen[- ]dependent/i,
    losExplicit:  /(?:expected length of stay|expected stay)[^.\d]{0,24}?(\d+)\s*day/i,
    losSameDay:   /same-day discharge|23-hour observation/i,
    losVague:     /multi-day stay/i,
    monitor:      /continuous[^.]{0,24}monitoring|pulmonary monitoring|pain control and mobilization/i,
    outpatientProc: /laparoscopic cholecystectomy/i
  };

  function extractFromDoc(text){
    var out = { comorbidities: [], matches: [] };
    var m;
    if (m = PAT.heartFailure.exec(text)) { out.comorbidities.push("Heart failure (EF " + m[1] + "%)"); out.matches.push(m[0]); }
    if (m = PAT.diabetes.exec(text))     { out.comorbidities.push("Type 2 diabetes"); out.matches.push(m[0]); }
    if (m = PAT.copdO2.exec(text))       { out.comorbidities.push("COPD, oxygen-dependent"); out.matches.push(m[0]); }
    if (m = PAT.losExplicit.exec(text))  { out.losDays = parseInt(m[1], 10); out.losStatus = "explicit"; out.losMatch = m[0]; out.matches.push(m[0]); }
    else if (m = PAT.losSameDay.exec(text)) { out.losDays = 0; out.losStatus = "explicit"; out.losMatch = m[0]; out.matches.push(m[0]); }
    else if (m = PAT.losVague.exec(text))   { out.losStatus = "vague"; out.losMatch = m[0]; out.matches.push(m[0]); }
    if (m = PAT.monitor.exec(text))      { out.monitorMatch = m[0]; out.matches.push(m[0]); }
    if (m = PAT.outpatientProc.exec(text)) { out.outpatientMatch = m[0]; out.matches.push(m[0]); }
    return out;
  }

  function analyzeCase(c){
    var facts = { comorbidities: [], losStatus: "none", monitorMatch: null, outpatientMatch: null };
    var docHTML = [];

    c.documents.forEach(function(d){
      var r = extractFromDoc(d.text);
      facts.comorbidities = facts.comorbidities.concat(r.comorbidities);
      if (r.losStatus === "explicit" && facts.losStatus !== "explicit") {
        facts.losStatus = "explicit"; facts.losDays = r.losDays; facts.losMatch = r.losMatch;
      } else if (r.losStatus === "vague" && facts.losStatus === "none") {
        facts.losStatus = "vague"; facts.losMatch = r.losMatch;
      }
      if (r.monitorMatch && !facts.monitorMatch) facts.monitorMatch = r.monitorMatch;
      if (r.outpatientMatch && !facts.outpatientMatch) facts.outpatientMatch = r.outpatientMatch;

      var snippet = esc(d.text);
      r.matches.forEach(function(mstr){
        var re = new RegExp(mstr.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
        snippet = snippet.replace(re, function(hit){ return "<mark>" + hit + "</mark>"; });
      });
      docHTML.push({ name: d.name, page: d.page, snippetHTML: snippet });
    });

    var criteria = [];
    criteria.push({ id: "setting", status: facts.outpatientMatch ? "not-met" : "met",
      evidence: facts.outpatientMatch
        ? 'Procedure text matched a routinely-outpatient pattern: “' + facts.outpatientMatch + '”.'
        : "No outpatient-only pattern matched in packet text; treated as inpatient-appropriate." });

    criteria.push({ id: "comorbid", status: facts.comorbidities.length ? "met" : "not-met",
      evidence: facts.comorbidities.length
        ? 'Matched in packet text: “' + facts.comorbidities.join('”, “') + '”.'
        : "No qualifying comorbidity language matched in packet text." });

    var losEv, losSt;
    if (facts.losStatus === "explicit") {
      losSt = facts.losDays >= 2 ? "met" : "not-met";
      losEv = 'Matched “' + facts.losMatch + '” — ' + facts.losDays + ' day(s), ' + (facts.losDays >= 2 ? "crosses" : "does not cross") + ' two midnights.';
    } else if (facts.losStatus === "vague") {
      losSt = "uncertain";
      losEv = 'Matched “' + facts.losMatch + '” — language present but no specific duration stated.';
    } else {
      losSt = "uncertain";
      losEv = "No length-of-stay language matched in packet text.";
    }
    criteria.push({ id: "los", status: losSt, evidence: losEv });

    criteria.push({ id: "monitor", status: facts.monitorMatch ? "met" : "not-met",
      evidence: facts.monitorMatch
        ? 'Matched “' + facts.monitorMatch + '” in packet text.'
        : "No post-operative monitoring language matched in packet text." });

    criteria = criteria.map(function(x){ return { id: x.id, label: CRIT[x.id].label, source: CRIT[x.id].source, status: x.status, evidence: x.evidence }; });

    var losFactVal = facts.losStatus === "explicit" ? (facts.losDays + " day(s) — " + facts.losMatch)
      : facts.losStatus === "vague" ? ('Not stated — only “' + facts.losMatch + '” found')
      : "Not documented in packet";

    var factsList = [
      { label: "Comorbidities", value: facts.comorbidities.length ? facts.comorbidities.join(", ") : "None matched" },
      { label: "Expected length of stay", value: losFactVal, uncertain: facts.losStatus !== "explicit" },
      { label: "Post-operative monitoring", value: facts.monitorMatch ? "Documented — “" + facts.monitorMatch + "”" : "Not documented" }
    ];

    var anyUncertain = criteria.some(function(x){ return x.status === "uncertain"; });
    var allMet = criteria.every(function(x){ return x.status === "met"; });

    return { criteria: criteria, factsList: factsList, docHTML: docHTML, anyUncertain: anyUncertain, allMet: allMet };
  }

  var cases = [
    {
      id: "c1",
      member: { name: "John Doe", mrn: "MBR-0042", age: 71 },
      procedure: "Elective open lumbar spinal fusion, L4–L5",
      setting: "Inpatient admission requested",
      submitted: "Day 0, 8:02 AM",
      decision: null,
      questionSent: false,
      documents: [
        { name: "Operative Plan", page: "p. 2 of 14", text: "Planned procedure: open posterior lumbar fusion, L4–L5, with instrumentation. Elective, scheduled admission." },
        { name: "History & Physical", page: "p. 6 of 14", text: "PMH significant for congestive heart failure (EF 40%) and type 2 diabetes mellitus. Surgeon anticipates a multi-day stay for pain control and mobilization; exact duration not specified." },
        { name: "Cardiology Clearance", page: "p. 9 of 14", text: "Patient cleared for elective surgery from a cardiac standpoint. Recommend standard perioperative monitoring." },
        { name: "Medication List", page: "p. 12 of 14", text: "Metformin 500mg BID, Lisinopril 10mg daily, Furosemide 20mg daily." }
      ],
      auditSeed: [
        { t: "Day 0, 8:02 AM", text: "Case opened. Packet received, 14 pages." },
        { t: "Day 0, 8:03 AM", text: "Extraction run over 4 documents. Length of stay language matched but no specific duration found." },
        { t: "Day 0, 8:03 AM", text: "Criteria matched against LCD L38795, MCG guidelines, 42 CFR 412.3, and Humana Policy IP-014." }
      ]
    },
    {
      id: "c2",
      member: { name: "Robert Alvarez", mrn: "MBR-1187", age: 74 },
      procedure: "Open reduction internal fixation, right hip fracture",
      setting: "Inpatient admission requested",
      submitted: "Day 0, 9:20 AM",
      decision: null,
      questionSent: false,
      documents: [
        { name: "Operative Plan", page: "p. 1 of 9", text: "Planned procedure: open reduction internal fixation, right femoral neck fracture." },
        { name: "History & Physical", page: "p. 3 of 9", text: "PMH significant for COPD, oxygen-dependent. Expected length of stay: 4 days for post-operative mobility training and pulmonary monitoring." },
        { name: "Anesthesia Consult", page: "p. 6 of 9", text: "Cleared for surgery with continuous pulse oximetry monitoring post-operatively." }
      ],
      auditSeed: [
        { t: "Day 0, 9:20 AM", text: "Case opened. Packet received, 9 pages." },
        { t: "Day 0, 9:21 AM", text: "Extraction run over 3 documents. All required facts matched directly." },
        { t: "Day 0, 9:21 AM", text: "Criteria matched against LCD L38795, MCG guidelines, 42 CFR 412.3, and Humana Policy IP-014." }
      ]
    },
    {
      id: "c3",
      member: { name: "Diane Foster", mrn: "MBR-2264", age: 66 },
      procedure: "Elective laparoscopic cholecystectomy",
      setting: "Inpatient admission requested",
      submitted: "Day 0, 10:05 AM",
      decision: null,
      questionSent: false,
      documents: [
        { name: "Operative Plan", page: "p. 1 of 6", text: "Planned procedure: laparoscopic cholecystectomy. Expected same-day discharge; planned 23-hour observation only." },
        { name: "History & Physical", page: "p. 3 of 6", text: "No significant comorbidities. Patient is otherwise healthy, ASA class I." }
      ],
      auditSeed: [
        { t: "Day 0, 10:05 AM", text: "Case opened. Packet received, 6 pages." },
        { t: "Day 0, 10:06 AM", text: "Extraction run over 2 documents. All required facts matched directly." },
        { t: "Day 0, 10:06 AM", text: "Criteria matched against LCD L38795, MCG guidelines, 42 CFR 412.3, and Humana Policy IP-014." }
      ]
    }
  ];

  cases.forEach(function(c){ c.audit = c.auditSeed.slice(); });

  var state = { role: "nurse", selectedId: "c1" };

  function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function statusChipHTML(status, size){
    var map = {
      pend:      { cls: "chip-pend", label: "Pending information" },
      ready:     { cls: "chip-ready", label: "Ready for review" },
      escalated: { cls: "chip-escalated", label: "Escalated" },
      approved:  { cls: "chip-approved", label: "Approved" },
      denied:    { cls: "chip-denied", label: "Denied" }
    };
    var m = map[status] || map.pend;
    return '<span class="' + (size === "big" ? "status-chip " : "qcard-chip ") + m.cls + '"><span class="status-dot"></span>' + m.label + '</span>';
  }

  function badgeHTML(status){
    if (status === "met") return '<span class="badge badge-met">Met</span>';
    if (status === "not-met") return '<span class="badge badge-notmet">Not met</span>';
    return '<span class="badge badge-uncertain">Uncertain</span>';
  }

  function displayStatus(c, analysis){
    if (c.decision) return c.decision; // "approved" | "escalated" | "denied"
    return analysis.anyUncertain ? "pend" : "ready";
  }

  function visibleCases(){
    if (state.role === "director") {
      return cases.filter(function(c){ return c.decision === "escalated" || c._wasEscalated; });
    }
    return cases;
  }

  function log(c, t, text){
    c.audit.push({ t: t, text: text });
  }

  function render(){
    var app = document.getElementById("app");
    var vis = visibleCases();
    if (vis.indexOf(cases.find(function(c){return c.id===state.selectedId;})) === -1) {
      state.selectedId = vis.length ? vis[0].id : null;
    }

    var sidebar = '' +
      '<div class="sidebar">' +
        '<div class="sidebar-head">' +
          '<div class="brand-mark">Prior Auth Console</div>' +
          '<div class="brand-sub">Utilization Management</div>' +
          '<div class="role-toggle" role="tablist" aria-label="View as">' +
            '<button class="role-btn' + (state.role === "nurse" ? " active" : "") + '" data-role="nurse" role="tab" aria-selected="' + (state.role === "nurse") + '">UM Nurse</button>' +
            '<button class="role-btn' + (state.role === "director" ? " active" : "") + '" data-role="director" role="tab" aria-selected="' + (state.role === "director") + '">Medical Director</button>' +
          '</div>' +
        '</div>' +
        '<div class="queue-label">Queue · ' + vis.length + (state.role === "director" ? " escalated" : "") + '</div>' +
        '<div class="queue-list">' +
          (vis.length ? vis.map(function(c){
            var a = analyzeCase(c);
            return '<button class="qcard' + (c.id === state.selectedId ? " active" : "") + '" data-select="' + c.id + '">' +
              '<div class="qcard-top"><span class="qcard-name">' + esc(c.member.name) + '</span><span class="qcard-id mono">' + esc(c.member.mrn) + '</span></div>' +
              '<div class="qcard-proc">' + esc(c.procedure) + '</div>' +
              statusChipHTML(displayStatus(c, a)) +
            '</button>';
          }).join("") : '<div class="queue-empty">No escalated cases right now. The Medical Director queue only shows cases a nurse has routed up.</div>') +
        '</div>' +
        '<div class="sidebar-foot">Illustrative prototype. Members, packets, and case outcomes are fictional test data, not real claims or PHI. Extraction below is a live rule-based engine run on the raw text — a stand-in for the model call this step would be in production, same output contract.</div>' +
      '</div>';

    var main = '<div class="main"><div class="main-inner" id="mainInner"></div></div>';
    app.innerHTML = sidebar + main;

    var selected = cases.find(function(c){ return c.id === state.selectedId; });
    var emptyMsg = vis.length ? "Select a case from the queue." : "Nothing here yet — a nurse hasn’t escalated a case. Switch to UM Nurse and escalate one from the queue.";
    document.getElementById("mainInner").innerHTML = selected ? renderCase(selected) : '<div class="main-empty">' + emptyMsg + '</div>';

    bind();
  }

  function renderCase(c){
    var a = analyzeCase(c);
    var status = displayStatus(c, a);
    var stepN = 0;

    var html = '';
    html += '<div class="case-head">' +
      '<div><div class="case-name">' + esc(c.member.name) + '</div>' +
      '<div class="case-meta">' + esc(c.member.mrn) + ' · age ' + c.member.age + '</div>' +
      '<div class="case-proc">' + esc(c.procedure) + ' — ' + esc(c.setting) + '</div></div>' +
      '<div class="case-status">' + statusChipHTML(status, "big") + '<div class="case-submitted">Submitted ' + esc(c.submitted) + '</div></div>' +
    '</div>';

    // Step 1: documents, with live-matched phrases highlighted
    stepN++;
    html += '<div class="step"><div class="step-head"><div class="step-num done">' + stepN + '</div><div class="step-title">Packet received — extraction run live over ' + c.documents.length + ' document' + (c.documents.length === 1 ? "" : "s") + '</div></div>' +
      '<div class="step-body"><div class="doc-grid">' +
      a.docHTML.map(function(d){
        return '<div class="doc"><div class="doc-name">' + esc(d.name) + '</div><div class="doc-page mono">' + esc(d.page) + '</div><div class="doc-snippet">' + d.snippetHTML + '</div></div>';
      }).join("") +
      '</div></div></div>';

    // Step 2: facts, derived from the extraction above
    stepN++;
    html += '<div class="step"><div class="step-head"><div class="step-num done">' + stepN + '</div><div class="step-title">Facts derived from extraction</div></div>' +
      '<div class="step-body">' +
      a.factsList.map(function(f){
        return '<div class="fact-row"><div class="fact-label">' + esc(f.label) + '</div><div class="fact-val' + (f.uncertain ? " uncertain" : "") + '">' + esc(f.value) + '</div></div>';
      }).join("") +
      '</div></div>';

    // Step 3: criteria, computed from the facts above
    stepN++;
    html += '<div class="step"><div class="step-head"><div class="step-num done">' + stepN + '</div><div class="step-title">Criteria match, cited to policy</div></div>' +
      '<div class="step-body"><div class="crit">' +
      a.criteria.map(function(x){
        return '<div class="crit-row"><div class="crit-status">' + badgeHTML(x.status) + '</div>' +
          '<div class="crit-body"><div class="crit-label">' + esc(x.label) + '</div>' +
          '<div class="crit-source mono">' + esc(x.source) + ' — ' + esc(x.evidence) + '</div></div></div>';
      }).join("") +
      '</div></div></div>';

    // Step 4: completeness gate (only while a criterion is genuinely uncertain)
    if (a.anyUncertain) {
      stepN++;
      var uncertainCrit = a.criteria.find(function(x){ return x.status === "uncertain"; });
      html += '<div class="step"><div class="step-head"><div class="step-num">' + stepN + '</div><div class="step-title">Completeness gate</div></div>' +
        '<div class="step-body"><div class="gate">' +
        '<div class="gate-label">Missing information</div>' +
        '<div class="gate-q">' + esc(GATE_Q[uncertainCrit.id] || uncertainCrit.label) + '</div>' +
        '<div class="gate-sub">Generated from the one criterion the extraction could not confirm — not a generic request for more information.</div>' +
        '<div class="gate-actions">' +
        (c.questionSent
          ? '<span class="gate-sent">✓ Question sent to provider. <button class="btn btn-good" data-action="reply" data-case="' + c.id + '">Simulate: provider responds</button></span>'
          : '<button class="btn btn-primary" data-action="send" data-case="' + c.id + '">Send targeted question to provider</button>') +
        '</div></div></div></div>';
    }

    // Step 5: recommendation (only once nothing is uncertain)
    if (!a.anyUncertain) {
      stepN++;
      var recApprove = a.allMet;
      html += '<div class="step"><div class="step-head"><div class="step-num done">' + stepN + '</div><div class="step-title">Recommendation</div></div>' +
        '<div class="step-body">';

      if (status === "ready") {
        html += '<div class="rec ' + (recApprove ? "approve" : "escalate") + '">' +
          '<div class="rec-label">' + (recApprove ? "Recommend: Approve" : "Does not meet criteria") + '</div>' +
          '<div class="rec-text">' + (recApprove
            ? "All 4 criteria met, each with a cited source. High-confidence recommendation."
            : "0 of 4 criteria met. The system does not recommend a denial — it routes to the Medical Director for review.") + '</div>' +
          (recApprove
            ? '<div class="rec-sub">This is a recommendation, not an automatic action. A nurse confirms every approval by hand.</div>'
            : '') +
          '<div class="rec-actions">' +
          (recApprove
            ? (state.role === "nurse"
                ? '<button class="btn btn-good" data-action="approve" data-case="' + c.id + '">Confirm approval</button>'
                : '<span class="director-lock">Awaiting nurse confirmation.</span>')
            : (state.role === "nurse"
                ? '<button class="btn btn-bad" data-action="escalate" data-case="' + c.id + '">Escalate to Medical Director</button>'
                : '<span class="director-lock">Awaiting nurse to route this case up.</span>')) +
          '</div></div>';
      } else if (status === "escalated") {
        html += '<div class="rec escalate">' +
          '<div class="rec-label">Escalated — awaiting Medical Director</div>' +
          '<div class="rec-text">0 of 4 criteria met. Routed for clinical review. The system has not recommended, and cannot issue, a denial.</div>' +
          '<div class="rec-actions">' +
          (state.role === "director"
            ? '<button class="btn btn-good" data-action="director-approve" data-case="' + c.id + '">Approve</button>' +
              '<button class="btn btn-bad" data-action="director-deny" data-case="' + c.id + '">Deny</button>'
            : '<span class="director-lock">Only the Medical Director can decide this case. Switch roles above to review it.</span>') +
          '</div></div>';
      } else if (status === "approved") {
        html += '<div class="decided-note"><b>Approved.</b> ' + (c._directorOverride ? "Medical Director approved on clinical review." : "Nurse confirmed the recommendation.") + ' Provider notified.</div>';
      } else if (status === "denied") {
        html += '<div class="decided-note"><b>Denied by Medical Director.</b> A specific reason has been recorded and shared with the member and provider, as CMS-0057-F requires. This decision opens an appeal.</div>';
      }
      html += '</div></div>';
    }

    // Audit trail
    html += '<div class="step"><button class="audit-toggle" data-action="toggle-audit"><span>Audit trail · ' + c.audit.length + ' events</span><span>↓</span></button>' +
      '<div class="audit-log" id="auditLog" hidden>' +
      c.audit.map(function(a2){ return '<div class="audit-item"><div class="audit-t">' + esc(a2.t) + '</div><div class="audit-text">' + esc(a2.text) + '</div></div>'; }).join("") +
      '</div></div>';

    return html;
  }

  function bind(){
    var app = document.getElementById("app");
    app.querySelectorAll("[data-role]").forEach(function(b){
      b.addEventListener("click", function(){ state.role = b.getAttribute("data-role"); render(); });
    });
    app.querySelectorAll("[data-select]").forEach(function(b){
      b.addEventListener("click", function(){ state.selectedId = b.getAttribute("data-select"); render(); });
    });
    var toggle = app.querySelector('[data-action="toggle-audit"]');
    if (toggle) toggle.addEventListener("click", function(){
      var log = document.getElementById("auditLog");
      log.hidden = !log.hidden;
    });

    var sendBtn = app.querySelector('[data-action="send"]');
    if (sendBtn) sendBtn.addEventListener("click", function(){
      var c = cases.find(function(x){ return x.id === sendBtn.getAttribute("data-case"); });
      c.questionSent = true;
      var uc = analyzeCase(c).criteria.find(function(x){ return x.status === "uncertain"; });
      log(c, "Day 0, 8:05 AM", "Targeted question sent to provider: “" + (GATE_Q[uc.id] || uc.label) + "”");
      render();
    });

    var replyBtn = app.querySelector('[data-action="reply"]');
    if (replyBtn) replyBtn.addEventListener("click", function(){
      var c = cases.find(function(x){ return x.id === replyBtn.getAttribute("data-case"); });
      // A real new document enters the packet. The same extraction pipeline
      // runs over it on the next render — nothing here is hand-set.
      c.documents.push({
        name: "Provider Addendum",
        page: "p. 1 of 1",
        text: "Provider response to targeted question: expected length of stay is 3 days, to allow for pain control and mobilization."
      });
      log(c, "Day 2, 10:40 AM", "Provider Addendum received (1 page). Re-running extraction over the full packet.");
      log(c, "Day 2, 10:41 AM", "Criteria re-evaluated against the updated packet.");
      render();
    });

    var appBtn = app.querySelector('[data-action="approve"]');
    if (appBtn) appBtn.addEventListener("click", function(){
      var c = cases.find(function(x){ return x.id === appBtn.getAttribute("data-case"); });
      c.decision = "approved";
      log(c, c.id === "c1" ? "Day 2, 10:42 AM" : "Day 0, 9:24 AM", "Nurse confirmed approval. Provider notified.");
      render();
    });

    var escBtn = app.querySelector('[data-action="escalate"]');
    if (escBtn) escBtn.addEventListener("click", function(){
      var c = cases.find(function(x){ return x.id === escBtn.getAttribute("data-case"); });
      c.decision = "escalated"; c._wasEscalated = true;
      log(c, "Day 0, 10:08 AM", "Nurse escalated to Medical Director. No denial recommended or issued at this step.");
      render();
    });

    var dApp = app.querySelector('[data-action="director-approve"]');
    if (dApp) dApp.addEventListener("click", function(){
      var c = cases.find(function(x){ return x.id === dApp.getAttribute("data-case"); });
      c.decision = "approved"; c._directorOverride = true;
      log(c, "Day 1, 9:15 AM", "Medical Director approved on clinical review, overriding the criteria match.");
      render();
    });

    var dDeny = app.querySelector('[data-action="director-deny"]');
    if (dDeny) dDeny.addEventListener("click", function(){
      var c = cases.find(function(x){ return x.id === dDeny.getAttribute("data-case"); });
      c.decision = "denied";
      log(c, "Day 1, 9:15 AM", "Medical Director denied, with a specific documented reason. Appeal rights issued to the member.");
      render();
    });
  }

  render();
})();
</script>
