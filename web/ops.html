<title>PA Desk Operations</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#f3f6f4;--panel:#ffffff;--ink:#14201c;--ink2:#51605b;--line:#d3dcd8;--acc:#1f6f5c;--accsoft:#e1efe9;--risk:#b8452f;--risksoft:#fbe8e3;--dir:#5f3aa8;--dirsoft:#ebe2f8;--amber:#8a5a00;--ambersoft:#fcefd0;--ok:#18764a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1614;--panel:#16211e;--ink:#e6efeb;--ink2:#a6b8b1;--line:#2b3a36;--acc:#4cc0a0;--accsoft:#12302a;--risk:#f08a73;--risksoft:#3a1f19;--dir:#b79cf0;--dirsoft:#2a2046;--amber:#f0b04a;--ambersoft:#35260c;--ok:#5fd18f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1614;--panel:#16211e;--ink:#e6efeb;--ink2:#a6b8b1;--line:#2b3a36;--acc:#4cc0a0;--accsoft:#12302a;--risk:#f08a73;--risksoft:#3a1f19;--dir:#b79cf0;--dirsoft:#2a2046;--amber:#f0b04a;--ambersoft:#35260c;--ok:#5fd18f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "IBM Plex Sans",system-ui,sans-serif;padding-inline:16px;padding-block:20px 60px}
main{max-width:1100px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:24px;margin:0 0 2px;font-weight:600}
.sub{color:var(--ink2);margin:0;max-width:620px}
.demo{background:var(--ambersoft);color:var(--amber);border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:500}
nav{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px}
nav button{font:inherit;font-weight:500;background:none;border:0;border-bottom:3px solid transparent;color:var(--ink2);padding:10px 14px;cursor:pointer}
nav button[aria-selected="true"]{color:var(--acc);border-bottom-color:var(--acc)}
h2{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);margin:26px 0 10px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .n{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{color:var(--ink2);font-size:12.5px;margin-top:4px}
.kpi.risk .n{color:var(--risk)}.kpi.acc .n{color:var(--acc)}.kpi.dir .n{color:var(--dir)}.kpi.amber .n{color:var(--amber)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{font-size:14px;margin:0 0 2px}.card p{margin:0 0 10px;color:var(--ink2);font-size:12.5px}
.bar{display:grid;grid-template-columns:minmax(120px,210px) 1fr 34px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.bar .t{background:var(--bg);border-radius:5px;height:16px;overflow:hidden}.bar .f{height:100%;border-radius:5px;background:var(--acc)}
.bar .v{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td:first-child{white-space:nowrap}
.note{color:var(--ink2);font-size:12.5px}
.future{border-style:dashed;background:transparent}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:500}
.pill.gap{background:var(--ambersoft);color:var(--amber)}
.big{font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;margin:2px 0 4px}
.big.risk{color:var(--risk)}
.decide{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--accsoft);font-size:12.5px}
.decide b{color:var(--acc);margin-right:8px;text-transform:uppercase;letter-spacing:.05em;font-size:11px}
.pill.live{background:var(--accsoft);color:var(--acc)}.pill.pilot{background:var(--ambersoft);color:var(--amber)}.pill.planned{background:var(--bg);color:var(--ink2);border:1px solid var(--line)}
[hidden]{display:none!important}
.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:var(--accsoft);outline:3px solid var(--acc);border-radius:6px}100%{background:transparent;outline:3px solid transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}}
</style>
<main>
<header>
<div><h1>PA Desk operations</h1><p class="sub">Two views of the same work. Executive: how much, how risky, how fast. Utilization management: who has what, and what is waiting.</p></div>
<div class="demo" id="demo"></div>
</header>
<nav role="tablist"><button role="tab" id="t-exec" aria-selected="true" aria-controls="p-exec">Executive</button><button role="tab" id="t-um" aria-selected="false" aria-controls="p-um">Utilization management</button></nav>
<section id="p-exec" role="tabpanel"></section>
<section id="p-um" role="tabpanel" hidden></section>
</main>
<script>
const LIVE = true;
let D = null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const dash = (v, suffix = "") => (v === null || v === undefined ? "n/a" : v + suffix);
const kpi = (n, l, cls = "") => `<div class="kpi ${cls}"><div class="n">${n}</div><div class="l">${l}</div></div>`;
function bars(rows, color) {
  const max = Math.max(1, ...rows.map((r) => r.n));
  return rows.map((r) => `<div class="bar"><span>${esc(r.label)}</span><span class="t"><span class="f" style="display:block;width:${(100 * r.n) / max}%;${color ? "background:" + color : ""}"></span></span><span class="v">${r.n}</span></div>`).join("");
}
function render() {
const E = D.exec, U = D.um;
$("#demo").textContent = LIVE ? `Live. Made-up demo data: ${D.n} cases. Updated ${D.generated}` : `Made-up demo data: ${D.n} cases. Snapshot from ${D.generated}`;
$("#p-exec").innerHTML = (() => {
const DC = E.decisions, att = DC.capacity.overdue + DC.capacity.due_soon;
const decide = (t) => `<div class="decide"><b>Decision</b>${t}</div>`;
const codes = DC.demand.codes.map((g) => `${esc(g.code)} (${g.n}, oldest ${g.oldest_days} days)`).join(", ");
const onboarded = DC.onboarded.map((s) => `<p style="margin:0 0 4px"><b>${esc(s.name)}</b>: ${s.cases} case(s), nurses agreed on ${dash(s.agree, "%")}, the AI would have approved ${s.missed} that a person sent on.</p>`).join("");
const pill = (st) => `<span class="pill ${st}">${{ live: "Onboarded", pilot: "Onboarded", planned: "Not submitted" }[st] || st}</span>`;
return `
<h2>Decisions for you</h2>
<div class="grid2">
 <div class="card"><h3>Capacity today</h3><div class="big ${att ? "risk" : ""}">${att}</div><p>cases are past or within 24 hours of the CMS deadline. ${DC.capacity.open} are open. ${DC.capacity.unassigned ? `${DC.capacity.unassigned} still wait at intake, the oldest ${DC.capacity.oldest_unassigned_days} days.` : "Nothing is waiting at intake."}</p>${decide("Reassign work, or add nurse capacity, before a deadline passes.")}</div>
 <div class="card"><h3>Which service to onboard next</h3><div class="big">${DC.demand.total}</div><p>open requests arrived for a procedure we do not cover. ${codes ? "Most waiting: " + codes + "." : "None are waiting."}</p>${decide("Approve the next service to onboard. The code with the most waiting requests goes first.")}</div>
 <div class="card"><h3>Policy review</h3><div class="big">${DC.owner.drafts}</div><p>policy drafts are waiting for the policy owner. The live library is version ${esc(DC.owner.version)}.</p>${decide("Make sure the owner has time to review. Nothing goes live without it.")}</div>
 <div class="card"><h3>Services onboarded</h3><div class="big">${DC.onboarded.length}</div>${onboarded || "<p>No service is onboarded yet.</p>"}${decide("Watch how often nurses agree against what the AI would have approved. Switch a service off if the AI misses too much.")}</div>
</div>
<h2>Service rollout</h2>
<div class="card"><div class="tw"><table>
<thead><tr><th>Service</th><th>Status</th><th class="num">Cases</th><th class="num">AI flagged</th><th class="num">Nurse agrees</th><th class="num">AI said approve, a person sent it on</th><th class="num">AI flagged, nurse approved</th></tr></thead><tbody>
${E.services.map((s) => `<tr><td>${esc(s.name)}</td><td>${pill(s.status)}</td><td class="num">${s.cases}</td><td class="num">${dash(s.flagged, "%")}</td><td class="num">${dash(s.agree, "%")}${s.reviews ? ` <span class="note">of ${s.reviews}</span>` : ""}</td><td class="num">${s.missed}</td><td class="num">${s.extra}</td></tr>`).join("")}
</tbody></table></div>
<p class="note" style="margin:10px 0 0">Nurse agrees: the nurse's first action on each case matched the AI, counted once per case. Watch the second-to-last column. It is the AI approving what a person then sent on. The last one only costs review time.</p></div>
<h2>Speed and deadlines</h2>
<div class="kpis">
 ${kpi(E.avg_hours === null ? "n/a" : E.avg_hours + " h", `Average time from received to decision (${E.decided} decided)`)}
 ${kpi(dash(E.within_deadline, "%"), "Decided within the CMS deadline")}
 ${kpi(E.overdue, "Open and past the deadline", E.overdue ? "risk" : "")}
 ${kpi(E.due_soon, "Open and due in 24 hours", E.due_soon ? "amber" : "")}
</div>
<h2>Leading indicators: days to weeks</h2>
<div class="card"><div class="tw"><table>
<thead><tr><th>Indicator</th><th class="num">Today</th><th>Better when</th><th>What it tells us</th></tr></thead><tbody>
<tr><td>First-review rate</td><td class="num">${dash(E.first_review_rate, "%")}</td><td>Higher</td><td class="note">Decided cases that did not need a pend. Based on ${E.decided} decided case(s).</td></tr>
<tr><td>Nurse agrees with the AI</td><td class="num">${dash(E.agree_rate, "%")}</td><td>Higher</td><td class="note">Of ${E.n_actions} case(s) with a nurse review, how many matched the recommendation. ${E.overrides} approved against it.</td></tr>
<tr><td>Avoidable pends</td><td class="num">${E.replies ? E.avoidable_pends + " of " + E.replies : '<span class="pill gap">no replies yet</span>'}</td><td>Lower</td><td class="note">Provider replies marked "already sent". The nurse picks the type when the reply is added.</td></tr>
<tr><td>Avoidable escalations</td><td class="num">${E.avoidable_escalations} of ${E.escalations}</td><td>Lower</td><td class="note">Escalations a director sent back because the packet already had the answer.</td></tr>
</tbody></table></div></div>
<h2>Lagging indicators: months, with Humana's data</h2>
<div class="card"><div class="tw"><table>
<thead><tr><th>Indicator</th><th class="num">Today</th><th>Better when</th><th>What it tells us</th></tr></thead><tbody>
<tr><td>Overturned because the info was in the packet</td><td class="num"><span class="pill gap">needs Humana data</span></td><td>Lower</td><td class="note">A denial is appealed and wins, and the packet already had the answer. Appeals arrive months later. This turns the early read into the full north star.</td></tr>
<tr><td>Cost per decision</td><td class="num"><span class="pill gap">needs finance data</span></td><td>Lower</td><td class="note">Total spend on a case divided by decided cases.</td></tr>
<tr><td>Month over month</td><td class="num"><span class="pill gap">needs 3 months</span></td><td>Trend</td><td class="note">The same numbers, one point per month. The prototype shows today only.</td></tr>
</tbody></table></div></div>`;
})();

const EF = D.eff, EO = EF.owner, EN = EF.nurse;
$("#p-um").innerHTML = `
<h2>Model efficiency</h2>
<h3 style="margin:0 0 6px">Key facts: the AI against the policy owner</h3>
<div class="kpis">
 ${kpi(dash(EO.precision, "%"), `Precision. Of the ${EO.drafted} key fact(s) the AI drafted, the owner approved ${EO.approved} and rejected ${EO.rejected}. A rejected one was a wrong guess. ${EO.edited} needed an edit first.`)}
 ${kpi(dash(EO.recall, "%"), `Recall. Of the real key facts, the share the AI found. The owner added ${EO.added} key fact(s) the AI missed, across ${EO.policies} approved policy build(s).`, EO.added ? "amber" : "")}
 ${kpi(dash(EO.edit_rate, "%"), `Edited first. Of the ${EO.approved} key fact(s) the owner approved, the share that needed a change before approval, across ${EO.policies} approved policy build(s).`)}
</div>
<h3 style="margin:14px 0 6px">Packets: the AI against the UM nurse</h3>
<div class="kpis">
 ${kpi(dash(EN.wrong_approvals_pct, "%"), `Wrong approvals. Of the ${EN.ai_approved} case(s) the AI said approve, the nurse sent on ${EN.wrong_approvals}. Goal 0. This is the dangerous miss, so recall.`, EN.wrong_approvals ? "risk" : "")}
 ${kpi(dash(EN.false_alarms_pct, "%"), `False alarms. Of the ${EN.ai_flagged} case(s) the AI flagged, the nurse approved ${EN.false_alarms} anyway. A high number means the AI flags too much, so precision.`, EN.false_alarms ? "amber" : "")}
</div>
<p class="note" style="margin:8px 0 0">One result per case: the nurse's first action against the AI's recommendation. Nurse recall: ${dash(EN.recall, "%")}. Nurse precision: ${dash(EN.precision, "%")}. The key fact numbers come from the policy owner's approve and reject choices on each policy.</p>
<h2>Right now</h2>
<div class="kpis">
 ${kpi(U.unassigned, "Waiting at intake, not assigned" + (U.unassigned ? ` (oldest ${U.oldest_unassigned_days} days)` : ""), U.unassigned ? "amber" : "")}
 ${kpi(U.open, "Open cases")}
 ${kpi(U.at_risk_open, "Open and at risk", "risk")}
 ${kpi(U.overdue, "Open and past the deadline", U.overdue ? "risk" : "")}
 ${kpi(U.due_soon, "Due in 24 hours", U.due_soon ? "amber" : "")}
</div>
<h2>How long open cases have waited</h2>
<div class="card"><p>Days since the case was received.</p>${bars(U.aging, "var(--amber)")}</div>
<h2>By nurse</h2>
<div class="card"><div class="tw"><table>
<thead><tr><th>Nurse</th><th class="num">Assigned</th><th class="num">Open</th><th class="num">Open and at risk</th><th class="num">Waiting on provider</th><th class="num">With director</th><th class="num">Past deadline</th><th class="num">Decided</th><th class="num">Avg hours to decision</th><th class="num">Approved against the AI</th></tr></thead><tbody>
${U.nurses.map((n) => `<tr><td>${esc(n.name)}</td><td class="num">${n.assigned}</td><td class="num">${n.open}</td><td class="num">${n.at_risk_open}</td><td class="num">${n.pended}</td><td class="num">${n.escalated}</td><td class="num">${n.overdue}</td><td class="num">${n.decided}</td><td class="num">${dash(n.avg_hours)}</td><td class="num">${n.overrides}</td></tr>`).join("")}
</tbody></table></div>
<p class="note" style="margin:10px 0 0">Hours to decision is elapsed time from received to decided, not minutes of active work. Tracking active time per case is a next step.</p></div>
<h2>By medical director</h2>
<div class="card"><div class="tw"><table>
<thead><tr><th>Medical director</th><th class="num">Waiting for a decision</th><th class="num">Oldest waiting (days)</th><th class="num">Decided</th><th class="num">Returned to nurse</th></tr></thead><tbody>
${U.directors.map((d) => `<tr><td>${esc(d.name)}</td><td class="num">${d.waiting}</td><td class="num">${dash(d.oldest_days)}</td><td class="num">${d.decided}</td><td class="num">${d.returned}</td></tr>`).join("")}
</tbody></table></div></div>`;
}

const tabs = { exec: ["#t-exec", "#p-exec"], um: ["#t-um", "#p-um"] };
function show(k) {
  for (const [key, [t, p]] of Object.entries(tabs)) { $(t).setAttribute("aria-selected", key === k); $(p).hidden = key !== k; }
  try { localStorage.setItem("pa-dash-tab", k); } catch (e) {}
}
for (const k of Object.keys(tabs)) $(tabs[k][0]).onclick = () => show(k);
try { const s = localStorage.getItem("pa-dash-tab"); if (s && tabs[s]) show(s); } catch (e) {}

// Live mode: ask the app for fresh numbers every few seconds. A number that changed flashes once.
const cells = () => [...document.querySelectorAll(".kpi .n, .bar .v, td.num")];
async function refresh() {
  try {
    const r = await fetch("/api/dashboard", { cache: "no-store" });
    if (r.status === 401 || r.status === 403) {
      $("#demo").textContent = r.status === 401 ? "Sign in to PA Desk first, then reopen this page." : "This view is for intake and medical directors.";
      return;
    }
    const next = await r.json();
    const before = cells().map((e) => e.textContent);
    D = next;
    render();
    const after = cells();
    if (before.length === after.length) after.forEach((e, i) => { if (before[i] !== e.textContent) e.classList.add("flash"); });
  } catch (e) { $("#demo").textContent = "Cannot reach PA Desk. Retrying."; }
}
if (LIVE) { refresh(); setInterval(refresh, 4000); } else render();
</script>
